<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Caspian Capital</title>
  <meta name="description" content="Contact Caspian Capital to discuss investing in Texas real estate." />
  <link rel="canonical" href="https://www.caspiancapitaltx.com/contact/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Caspian Capital" />
  <meta property="og:title" content="Contact Caspian Capital" />
  <meta property="og:description" content="Contact Caspian Capital to discuss investing in Texas real estate." />
  <meta property="og:url" content="https://www.caspiancapitaltx.com/contact/" />
  <meta property="og:image" content="https://www.caspiancapitaltx.com/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Caspian Capital logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>if (window.self !== window.top) document.documentElement.classList.add("embedded");</script>
</head>
  
<body class="body-form">

  <main class="form-wrapper">
    <a class="form-back-link" href="/">&larr; Back to Caspian Capital</a>
    <h1 class="form-heading">Contact Us</h1>
    <form id="contact-form">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="Full Name" required />
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="Email" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone" />
      </div>

      <div class="form-group">
        <label for="message">How can we help you?</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </div>

      <button type="submit" class="submit-button">Submit</button>
      <p class="form-error" role="alert" hidden></p>
    </form>

    <div id="confirmation" class="thank-you" role="status" hidden>
      <img class="thank-you-logo" src="/images/logo-wordmark.svg" alt="Caspian Capital" />
      <p class="thank-you-text">Thank you! 🎊 Your message has been sent to the team 📩</p>
      <a class="thank-you-back" href="/">&larr; Back to Caspian Capital</a>
    </div>
  </main>

<script src="/thank-you.js"></script>
<script src="/form-submit.js"></script>
<!--   Script for submitting the Contact Form -->
  <script>
  const contactForm = document.getElementById('contact-form');

  contactForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const outcome = await sendForm(contactForm, {
      formType: 'contact',
      name: contactForm.name.value,
      email: contactForm.email.value,
      phone: contactForm.phone.value,
      message: contactForm.message.value
    });
    if (outcome.ok) showThankYou(contactForm);
  });
</script>

</body>
</html>
