<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invest with Caspian Capital | Texas Real Estate Investment</title>
  <meta name="description" content="Share your goals, timeline and budget to explore Texas real estate investment opportunities with Caspian Capital." />
  <link rel="canonical" href="https://www.caspiancapitaltx.com/invest/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Caspian Capital" />
  <meta property="og:title" content="Invest with Caspian Capital | Texas Real Estate Investment" />
  <meta property="og:description" content="Share your goals, timeline and budget to explore Texas real estate investment opportunities with Caspian Capital." />
  <meta property="og:url" content="https://www.caspiancapitaltx.com/invest/" />
  <meta property="og:image" content="https://www.caspiancapitaltx.com/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Caspian Capital logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>if (window.self !== window.top) document.documentElement.classList.add("embedded");</script>
</head>
  
<body class="body-form">

  <main class="form-wrapper">
    <a class="form-back-link" href="/">&larr; Back to Caspian Capital</a>
    <h1 class="form-heading">Invest with Caspian Capital</h1>
    <form id="invest-form">
      <div class="form-group">
        <label for="full-name">Full Name *</label>
        <input type="text" id="full-name" name="fullName" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="Email" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone *</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone" required>
      </div>

      <div class="form-group">
        <label for="investor-type">Investor Type *</label>
        <select id="investor-type" name="investorType" required>
          <option value="" disabled selected hidden>Please select</option>
          <option value="Individual">Individual</option>
          <option value="IRA">IRA</option>
          <option value="Trust">Trust</option>
          <option value="LLC">LLC</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="timeline">When are you looking to invest? *</label>
        <select id="timeline" name="timeline" required>
          <option value="" disabled selected hidden>Please select</option>
          <option value="Immediately">Immediately</option>
          <option value="1-3 Months">1-3 Months</option>
          <option value="3-6 Months">3-6 Months</option>
          <option value="6+ Months">6+ Months</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budget">How much are you looking to invest? *</label>
        <select id="budget" name="budget" required>
          <option value="" disabled selected hidden>Please select</option>
          <option value="$10k–$50k">$10k–$50k</option>
          <option value="$50k–$100k">$50k–$100k</option>
          <option value="$100k–$250k">$100k–$250k</option>
          <option value="$250k+">$250k+</option>
        </select>
      </div>

      <div class="form-group">
        <p style="font-style: italic; margin-bottom: 4px;">
          SEC regulations require us to verify investor status before sharing specific investment details.
        </p>
        <label for="accredited">
          Are you an accredited investor as defined by the SEC?<br />
          <small>
            Accredited investors typically have a net worth of $1M+ excluding primary residence OR an annual income of $200K+ individually or $300K+ jointly for the past two years.
          </small>
        </label>
        <select id="accredited" name="accredited" required>
          <option value="" disabled selected hidden>Please select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Unsure">Unsure</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Any Additional Notes?</label>
        <textarea id="notes" name="notes" rows="4"></textarea>
      </div>

      <button type="submit" class="submit-button">Submit</button>
    </form>

    <div id="confirmation" class="thank-you" role="status" hidden>
      <img class="thank-you-logo" src="/images/logo-wordmark.svg" alt="Caspian Capital" />
      <p class="thank-you-text">Thank you! 🎊 Your information has been submitted to the team 📩</p>
      <a class="thank-you-back" href="/">&larr; Back to Caspian Capital</a>
    </div>
  </main>

<!--  Script for submitting the Invest Form  -->
  <script>
  // Swap the form for the thank-you message. Inside the modal, also ask modal.js to close itself
  // after a few seconds (modal.js listens for this message).
  function showThankYou(form) {
    form.style.display = 'none';
    document.querySelector('.form-wrapper').classList.add('is-thankyou');
    document.getElementById('confirmation').hidden = false;
    if (window.self !== window.top) {
      setTimeout(function () {
        window.parent.postMessage({ type: 'site-modal:request-close' }, window.location.origin);
      }, 4500);
    }
  }

  document.getElementById('invest-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = e.target;
    const data = new URLSearchParams();
    data.append('formType', 'invest');
    data.append('fullName', form.fullName.value);
    data.append('email', form.email.value);
    data.append('phone', form.phone.value);
    data.append('investorType', form.investorType.value);
    data.append('accredited', form.accredited.value); // match Apps Script
    data.append('timeline', form.timeline.value);
    data.append('budget', form.budget.value);
    data.append('message', form.notes.value); // match "message" in Apps Script

    try {
      const res = await fetch('https://script.google.com/macros/s/AKfycbyZAc5-LouC4Ol6M1vs78YmJ__SivZTjeXhlHKa6oRNMB9LNR4mzt11KXNRA4xfQ95Tyg/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data
      });

      const result = await res.json();
      if (result.result === 'success') {
        showThankYou(form);
      } else {
        alert('❌ Something went wrong. Please try again.');
      }
    } catch (error) {
      alert('⚠️ Error: ' + error.message);
    }
  });
</script>


</body>
</html>
